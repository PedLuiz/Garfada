name: garfada_e2e

services:
  db:
    image: postgres:15-alpine
    container_name: garfada_e2e_db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: garfada_e2e
    volumes:
      - garfada_e2e_postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d garfada_e2e"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: garfada_e2e_backend
    ports:
      - "3002:3001"
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: test
      PORT: 3001
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: garfada_e2e
      PGUSER: postgres
      PGPASSWORD: postgres
      JWT_SECRET: garfada-e2e-secret
      JWT_EXPIRES_IN: 1h
      PASSWORD_PBKDF2_ITERATIONS: 1000
      CORS_ORIGIN: http://127.0.0.1:5174,http://localhost:5174,http://frontend:5173
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: garfada_e2e_frontend
    ports:
      - "5174:5173"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: ${FRONTEND_API_URL:-http://backend:3001}
    command: npm run dev -- --host 0.0.0.0 --port 5173
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  e2e:
    image: mcr.microsoft.com/playwright:v1.60.0-noble
    profiles:
      - runner
    user: "${E2E_UID:-1000}:${E2E_GID:-1000}"
    depends_on:
      frontend:
        condition: service_healthy
    working_dir: /workspace/frontend
    volumes:
      - .:/workspace
    environment:
      CI: "true"
      HOME: /tmp
      NPM_CONFIG_CACHE: /tmp/.npm
      E2E_SKIP_WEB_SERVER: "1"
      E2E_BASE_URL: http://frontend:5173
      E2E_API_URL: http://backend:3001
    command: npx playwright test

volumes:
  garfada_e2e_postgres_data:
