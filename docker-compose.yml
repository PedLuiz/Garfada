services:
  db:
    image: postgres:15
    container_name: projeto_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-garfada}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-garfada123}
      POSTGRES_DB: ${POSTGRES_DB:-garfada_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-garfada} -d ${POSTGRES_DB:-garfada_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: ./backend
    container_name: projeto_backend
    ports:
      - "${PORT:-3001}:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      PORT: ${PORT:-3001}
      DATABASE_URL: postgresql://${POSTGRES_USER:-garfada}:${POSTGRES_PASSWORD:-garfada123}@db:5432/${POSTGRES_DB:-garfada_db}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: projeto_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
    depends_on:
      - backend

volumes:
  postgres_data:
